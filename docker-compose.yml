version: '3.8'

services:
  # MongoDB Database (Local Development / Testing)
  mongodb:
    image: mongo:7.0
    container_name: fintech-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fintech_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - fintech-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Netflix Eureka Discovery Server
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: fintech-discovery-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    networks:
      - fintech-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: fintech-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - fintech-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: fintech-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - MONGO_URI=${MONGO_AUTH_URI:-mongodb://mongodb:27017/auth_db}
    depends_on:
      discovery-server:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - fintech-network

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: fintech-account-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - MONGO_URI=${MONGO_ACCOUNT_URI:-mongodb://mongodb:27017/account_db}
    depends_on:
      discovery-server:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - fintech-network

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: fintech-transaction-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - MONGO_URI=${MONGO_TRANSACTION_URI:-mongodb://mongodb:27017/transaction_db}
    depends_on:
      discovery-server:
        condition: service_started
      account-service:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
